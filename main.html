<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="site/frontend/styles/main.css" />
    <title>Programando...</title>
  </head>
  <body>
    <div id="layout">
      <main>
        <h1>CRASH STORE</h1>
        <div id="slider">
          <ul class="listaFrutas">
            <li data-info="Rocket: Boa para iniciantes.">
              <img src="site/frontend/imgs/Rocket_Fruit.webp" alt="Rocket" />
            </li>
            <li data-info="Spin: Ataques giratórios.">
              <img src="site/frontend/imgs/Spin_Fruit.webp" alt="Spin" />
            </li>
            <li data-info="Chop: Imune a espadas.">
              <img src="site/frontend/imgs/Blade_Fruit.webp" alt="Chop" />
            </li>
            <li data-info="Spring: Alta mobilidade.">
              <img src="site/frontend/imgs/Spring_Fruit.webp" alt="Spring" />
            </li>
            <li data-info="Bomb: Explosão forte.">
              <img src="site/frontend/imgs/Bomb_Fruit.webp" alt="Bomb" />
            </li>
            <li data-info="Smoke: Controle de área.">
              <img src="site/frontend/imgs/Smoke_Fruit.webp" alt="Smoke" />
            </li>
            <li data-info="Spike: Dano físico.">
              <img src="site/frontend/imgs/Spike_Fruit.webp" alt="Spike" />
            </li>
            <li data-info="Flame: Muito usada no early game.">
              <img src="site/frontend/imgs/Flame_Fruit.webp" alt="Flame" />
            </li>
            <li data-info="Falcon: Forma aérea e velocidade.">
              <img src="site/frontend/imgs/Eagle_Fruit.webp" alt="Falcon" />
            </li>
            <li data-info="Ice: Muito boa para PvP e stun.">
              <img src="site/frontend/imgs/Ice_Fruit.webp" alt="Ice" />
            </li>
            <li data-info="Sand: Controle de areia e cegueira.">
              <img src="site/frontend/imgs/Sand_Fruit.webp" alt="Sand" />
            </li>
            <li data-info="Dark: Excelente para combos de PvP.">
              <img src="site/frontend/imgs/Dark_Fruit.webp" alt="Dark" />
            </li>
            <li data-info="Diamond: Defesa extremamente alta.">
              <img src="site/frontend/imgs/Diamond_Fruit.webp" alt="Diamond" />
            </li>
            <li data-info="Light: A melhor para farmar e voar.">
              <img src="site/frontend/imgs/Light_Fruit.webp" alt="Light" />
            </li>
            <li data-info="Rubber: Inspirada no Luffy (Gomu Gomu).">
              <img src="site/frontend/imgs/Rubber_Fruit.webp" alt="Rubber" />
            </li>
            <li data-info="Creation: Habilidades de suporte.">
              <img
                src="site/frontend/imgs/Creation_Fruit.webp"
                alt="Creation"
              />
            </li>
            <li data-info="Magma: O maior dano contínuo do jogo.">
              <img src="site/frontend/imgs/Magma_Fruit.webp" alt="Magma" />
            </li>
            <li data-info="Love: Habilidades de charme e controle.">
              <img src="site/frontend/imgs/Love_Fruit.webp" alt="Love" />
            </li>
            <li data-info="Spider: Teias e excelente mobilidade PvP.">
              <img src="site/frontend/imgs/Spider_Fruit.webp" alt="Spider" />
            </li>
            <li data-info="Sound: Ataques baseados em ondas sonoras.">
              <img src="site/frontend/imgs/Sound_Fruit.webp" alt="Sound" />
            </li>
            <li data-info="Phoenix: Regeneração passiva e cura.">
              <img src="site/frontend/imgs/Phoenix_Fruit.webp" alt="Phoenix" />

            <li data-info="Portal: Teleporte e fendas dimensionais.">
              <img src="site/frontend/imgs/Portal_Fruit.webp" alt="Portal" />

            <li data-info="Pain: Reflete dano e ataques em área.">
              <img src="site/frontend/imgs/Pain_Fruit.webp" alt="Pain" />
            </li>
            <li data-info="Blizzard: Tornados de gelo e controle.">
              <img
                src="site/frontend/imgs/Blizzard_Fruit.webp"
                alt="Blizzard"
              />

            <li data-info="Gravity: Ataques pesados de meteoros.">

            <li data-info="Mammoth: Transformação em forma gigante.">

            </li>

              <img src="site/frontend/imgs/T-Rex_Fruit.webp" alt="T-Rex" />

              <img src="site/frontend/imgs/Dough_Fruit.webp" alt="Dough" />

            <li data-info="Shadow: Dano sombrio e cegueira.">

            </li>
            <li data-info="Venom: Veneno contínuo muito apelão.">
              <img src="site/frontend/imgs/Venom_Fruit.webp" alt="Venom" />
            </li>
            <li data-info="Control: Cria áreas de manipulação.">
              <img src="site/frontend/imgs/Control_Fruit.webp" alt="Control" />
            </li>
            <li data-info="Spirit: Invoca espíritos de fogo e gelo.">
              <img src="site/frontend/imgs/Spirit_Fruit.webp" alt="Spirit" />
            </li>
            <li data-info="Dragon: Uma das Mythical mais poderosas.">
              <img src="site/frontend/imgs/Dragon_Fruit.webp" alt="Dragon" />
            </li>
            <li data-info="Leopard: Velocidade e força extremas.">
              <img src="site/frontend/imgs/Tiger_Fruit.webp" alt="Leopard" />
            </li>
            <li data-info="Kitsune: Extremamente rara e poderosa.">
              <img src="site/frontend/imgs/Kitsune_Fruit.webp" alt="Kitsune" />
            </li>
            <li data-info="Buddha: A melhor fruta para farm e Raids.">
              <img src="site/frontend/imgs/Buddha_Fruit.webp" alt="Buddha" />
            </li>
            <li data-info="Rumble: Controle elétrico e teleporte.">
              <img src="site/frontend/imgs/Lightning_Fruit.webp" alt="Rumble" />
            </li>
            <li data-info="Quake: Ondas de choque devastadoras.">
              <img src="site/frontend/imgs/Quake_Fruit.webp" alt="Quake" />
            </li>
          </ul>
          <button id="prev">
            <img
              src="site/frontend/imgs/seta_esquerda.svg"
              alt="seta_esquerda"
            />
          </button>
          <button id="next">
            <img src="site/frontend/imgs/seta_direita.svg" alt="seta_direita" />
          </button>
          <div class="tooltip" id="tooltip"></div>
        </div>
      </main>
    </div>

    <script src="site/backend/scripts.js"></script>

</html>
